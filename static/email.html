<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Email</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .ie-header {
            background: #002244;
            color: #fff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }
        .ie-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #FB4F14;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ie-header-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .ie-home-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .ie-home-btn:hover { background: rgba(255,255,255,0.1); }

        /* ── Conversation history strip ── */
        #conv-strip {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 8px 16px;
            display: none;
        }
        #conv-strip .conv-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 4px;
        }
        #conv-lines {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 100px;
            overflow-y: auto;
        }
        .conv-line {
            align-self: flex-end;
            background: #007AFF;
            color: #fff;
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 13px;
            max-width: 80%;
        }

        /* ── Listening panel (wake-word / partner speech) ── */
        #listening-panel {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 16px;
            display: none;
        }
        .listen-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }
        .mic-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 1s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .transcript-box {
            background: #eff6ff;
            border: 2px solid #93c5fd;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 16px;
            font-style: italic;
            color: #1e40af;
            min-height: 44px;
            font-weight: 500;
        }

        /* ── Options grid ── */
        #options-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .opt-btn {
            background: #fff;
            border: 2px solid #002244;
            border-radius: 10px;
            padding: 14px 10px;
            font-size: 14px;
            font-weight: 600;
            color: #002244;
            cursor: pointer;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
            transition: background 0.12s, color 0.12s;
        }
        .opt-btn:hover { background: #002244; color: #fff; }
        .opt-btn.action-btn {
            background: #002244;
            color: #FB4F14;
            border-color: #002244;
        }
        .opt-btn.action-btn:hover { background: #001533; }
        .opt-btn.danger-btn {
            border-color: #dc2626;
            color: #dc2626;
        }
        .opt-btn.danger-btn:hover { background: #dc2626; color: #fff; }
        .opt-btn.highlighted {
            background: #FB4F14;
            color: #fff;
            border-color: #FB4F14;
            outline: 3px solid #002244;
        }

        /* ── Loading overlay ── */
        #loading-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #loading-overlay.visible { display: flex; }
        .spinner {
            width: 48px; height: 48px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #FB4F14;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Empty / info state ── */
        .info-msg {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            padding: 32px 16px;
        }

        .screen-title {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>

<header class="ie-header">
    <h1 id="page-title">Independent Email</h1>
    <div class="ie-header-actions">
        <button class="ie-home-btn" id="home-btn">Home</button>
    </div>
</header>

<!-- Conversation history (shows once user has composed lines) -->
<div id="conv-strip">
    <div class="conv-label">Email draft</div>
    <div id="conv-lines"></div>
</div>

<!-- Listening indicator (wake word + partner speech) -->
<div id="listening-panel">
    <div class="listen-status">
        <div class="mic-dot"></div>
        <span id="listen-label">Listening…</span>
    </div>
    <div class="transcript-box" id="transcript-box">(waiting…)</div>
</div>

<!-- Main options area -->
<div id="options-area">
    <div class="screen-title" id="screen-title"></div>
    <div class="options-grid" id="options-grid"></div>
</div>

<!-- Loading overlay -->
<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<script src="/static/token-refresh.js"></script>
<script src="/static/email.js"></script>
</body>
</html>
